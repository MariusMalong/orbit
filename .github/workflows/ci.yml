name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes about a minute and a half.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs `prisma generate`
      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Runs the app against a real Postgres and drives it in a browser.
  e2e:
    runs-on: ubuntu-latest
    # A normal run takes about two minutes. Without a limit, a hung step
    # would block pull requests for GitHub's default of 6 hours.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/orbit?schema=public
      DIRECT_URL: postgresql://postgres:password@localhost:5432/orbit?schema=public
      # Only signs this throwaway CI server's sessions.
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      # Just the browser. GitHub's Ubuntu runners already have the system
      # libraries Chromium needs (they ship Google Chrome), and installing
      # them with --with-deps goes through apt, which kept hanging.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:e2e
        timeout-minutes: 10

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
